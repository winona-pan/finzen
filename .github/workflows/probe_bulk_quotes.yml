name: 探測批次股價來源（臨時）
on:
  push:
    branches: [ "claude/**" ]
    paths: [ "fetch_all_quotes.py", ".github/workflows/probe_bulk_quotes.yml" ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          python fetch_all_quotes.py
          du -sh public/quotes
          ls -la public/quotes public/quotes/us | head -40
          head -c 400 public/quotes/tw.json; echo
          head -c 300 public/quotes/us/A.json; echo
          for f in public/quotes/tw.json public/quotes/us/A.json public/quotes/us/S.json; do echo "$f gzip bytes = $(gzip -c $f | wc -c)"; done
          python -c "import json; d=json.load(open('public/quotes/tw.json')); print({k:d.get(k) for k in ['2330','0050','009816','2345','2368','6488','00411A']})"
          python -c "import json; print({k:json.load(open('public/quotes/us/'+k[0]+'.json')).get(k) for k in ['VOO','QQQ','AAPL','BRK-B','TSM']})"
