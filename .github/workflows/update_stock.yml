name: 自動更新股價與匯率並部署網站

on:
  schedule:
    # 每個交易日（週一到週五）台灣時間下午 1:50 跑一次：台股 1:30 收盤後拿當天收盤價，美股則是前一個交易日的收盤
    # （GitHub 的 cron 用 UTC，台灣時間 13:50 = UTC 05:50；GitHub 排程常會晚個幾分鐘到半小時才真的開始跑）
    - cron: '50 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行更新腳本（股價 + 匯率）
        run: python update_stock_prices.py

      - name: 全市場報價（台股＋美股，只放進網站、不存進 git）
        run: python fetch_all_quotes.py || echo "全市場報價抓取失敗，這次網站沿用不到新資料，不影響部署"

      - name: 推送更新（存回 repo 留紀錄，跟部署與否無關）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/stock_prices.json public/rates.json
          git diff --staged --quiet || git commit -m "🤖 自動更新股價與匯率 $(date +'%Y-%m-%d %H:%M')"
          git push || echo "沒有變動可推送，或推送失敗但不影響下面的部署"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
